<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reportes Piletas — Ingresar</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; align-items: center;
           justify-content: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 32px 40px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 340px; }
    h1 { color: #1F4E78; font-size: 20px; margin-bottom: 4px; }
    p.sub { color: #888; font-size: 13px; margin-top: 0; margin-bottom: 24px; }
    label { font-size: 12px; color: #555; display: block; margin-top: 12px; }
    input, button { width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: 1px solid #ccc;
                    font-size: 14px; box-sizing: border-box; }
    button { background: #1F4E78; color: white; border: none; margin-top: 20px; cursor: pointer; font-weight: bold; }
    button:hover { background: #163a5c; }
    .error { font-size: 13px; color: #9C0006; background: #FFC7CE; padding: 8px 10px; border-radius: 6px;
             margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reportes Piletas</h1>
    <p class="sub">Ingresá con tu email y contraseña</p>
    <form method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Ingresar</button>
    </form>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
